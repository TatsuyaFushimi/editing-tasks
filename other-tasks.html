<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23111214'/><path d='M4 11L4 4L11 4' fill='none' stroke='%23ff6a1a' stroke-width='1' opacity='0.7'/><path d='M21 4L28 4L28 11' fill='none' stroke='%23ff6a1a' stroke-width='1' opacity='0.7'/><path d='M4 21L4 28L11 28' fill='none' stroke='%23ff6a1a' stroke-width='1' opacity='0.7'/><path d='M21 28L28 28L28 21' fill='none' stroke='%23ff6a1a' stroke-width='1' opacity='0.7'/><circle cx='9' cy='24' r='3.5' fill='none' stroke='%23ff6a1a' stroke-width='1.5'/><circle cx='23' cy='24' r='3.5' fill='none' stroke='%23ff6a1a' stroke-width='1.5'/><circle cx='16' cy='16' r='2.5' fill='%23ff6a1a' opacity='0.3'/><circle cx='16' cy='16' r='1.5' fill='%23ff6a1a'/><line x1='11.5' y1='21' x2='21' y2='8' stroke='%23ff6a1a' stroke-width='1.8' stroke-linecap='round'/><line x1='20.5' y1='21' x2='11' y2='8' stroke='%23ff6a1a' stroke-width='1.8' stroke-linecap='round'/></svg>">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>その他タスク</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:       #111214;
      --surface:  #1a1c20;
      --surface2: #222428;
      --border:   #2e3035;
      --orange:   #ff6a1a;
      --text:     #e0e0e0;
      --sub:      #777;
      --muted:    #3a3a3a;
      --green:    #68d391;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px 16px 60px;
      font-size: 13px;
    }
    .top-bar {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 24px; border-bottom: 1px solid var(--border);
      padding-bottom: 16px; flex-wrap: wrap;
    }
    .dot { width:10px;height:10px;background:var(--green);border-radius:50%;box-shadow:0 0 8px var(--green);flex-shrink:0; }
    h1 { font-size:1.15rem;font-weight:700;color:#fff;letter-spacing:.02em; }
    .spacer { flex:1; }
    .btn {
      border: none; border-radius: 8px; padding: 6px 14px;
      font-size: 0.78rem; font-weight: 600; cursor: pointer;
      letter-spacing: .03em; transition: opacity .15s; text-decoration: none;
    }
    .btn:hover { opacity: .8; }
    .btn-orange { background: var(--orange); color: #fff; }
    .btn-green  { background: rgba(104,211,145,.2); color: var(--green); border: 1px solid rgba(104,211,145,.4); }
    .btn-ghost  { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .back-link {
      font-size: .78rem; color: var(--sub); text-decoration: none;
      display: inline-flex; align-items: center; gap: 4px;
      transition: color .15s;
    }
    .back-link:hover { color: var(--orange); }

    /* コピーバナー */
    #copy-banner {
      display: none;
      background: var(--surface);
      border: 1px solid var(--orange);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 16px;
    }
    #copy-banner p { font-size:.78rem; color: var(--sub); margin-bottom: 8px; }
    #copy-text {
      width:100%; background: var(--bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 10px; font-size:.8rem; font-family: monospace;
      resize: vertical; min-height: 80px;
    }

    /* セクションラベル */
    .section-label {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 4px 14px; border-radius: 4px;
      font-size:.72rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
      margin: 22px 0 10px;
    }
    .label-active { background:rgba(104,211,145,.1); color:var(--green); border-left:3px solid var(--green); }
    .label-cal    { background:rgba(99,179,237,.1); color:#63b3ed; border-left:3px solid #63b3ed; }
    .label-done   { background:rgba(255,255,255,.04); color:#555; border-left:3px solid #333; }

    /* テーブル */
    .wrap { width:100%; overflow-x:auto; }
    table {
      width:100%; border-collapse:collapse; background:var(--surface);
      border-radius:10px; overflow:hidden; min-width:700px;
      border:1px solid var(--border);
    }
    th {
      background:var(--surface2); padding:9px 12px; text-align:left;
      font-size:.7rem; font-weight:700; color:var(--sub);
      letter-spacing:.06em; text-transform:uppercase;
      white-space:nowrap; border-bottom:1px solid var(--border);
    }
    td {
      padding:8px 12px; border-top:1px solid var(--border);
      vertical-align:middle; white-space:nowrap; color:var(--text);
    }
    tr:hover td { background:rgba(255,255,255,.03); }
    tr.done-row td { opacity: .4; }

    /* 編集セル */
    .edit-text, .edit-date, .edit-select {
      background: rgba(255,106,26,.07);
      border: 1px solid transparent;
      border-radius: 4px;
      color: var(--text);
      font-size: 0.8rem;
      padding: 3px 7px;
      width: 100%;
      min-width: 80px;
      transition: background .15s, border-color .15s;
    }
    .edit-text:focus, .edit-date:focus, .edit-select:focus {
      outline: none;
      background: rgba(255,106,26,.15);
      border-color: var(--orange);
    }
    .edit-text::placeholder { color: var(--muted); }
    .edit-date { min-width: 110px; cursor: pointer; }
    .edit-select { cursor: pointer; }
    .edit-select option { background: var(--surface2); color: var(--text); }
    input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(.4); cursor: pointer; }
    input[type="date"]::-webkit-datetime-edit { color: transparent; }
    input[type="date"].has-value::-webkit-datetime-edit { color: var(--text); }

    /* ステータスバッジ */
    .status-badge {
      padding:2px 9px; border-radius:20px; font-size:.72rem; font-weight:700;
    }
    .s-todo  { background:rgba(255,255,255,.07); color:#aaa; }
    .s-wip   { background:rgba(99,179,237,.15);  color:#63b3ed; }
    .s-wait  { background:rgba(252,211,77,.12);  color:#f6d860; }
    .s-done  { background:rgba(104,211,145,.12); color:#68d391; }

    /* 空状態 */
    .empty { color:#444; text-align:center; padding:30px; line-height:1.8; }

    /* 変更ハイライト */
    .changed { border-color: var(--orange) !important; }

    /* 完了チェックボタン */
    .done-btn {
      border: none; background: transparent; cursor: pointer;
      font-size: 1rem; padding: 2px 6px; border-radius: 4px;
      transition: background .15s;
    }
    .done-btn:hover { background: rgba(104,211,145,.15); }
  </style>
</head>
<body>

<div class="top-bar">
  <div class="dot"></div>
  <h1>その他タスク</h1>
  <span id="change-count" style="font-size:.78rem;color:var(--orange)"></span>
  <div class="spacer"></div>
  <a href="https://calendar.google.com/calendar/u/0/r/week" target="_blank" class="btn btn-ghost">📅 カレンダー</a>
  <a href="https://docs.google.com/spreadsheets/d/1VswrYvsGmY7hKLXwIjh9cptVHqhwthCiy5hatLvn-A4/edit?gid=706953571#gid=706953571" target="_blank" class="btn btn-ghost">📊 制作管理</a>
  <button class="btn btn-ghost" onclick="showCopy()">📋 変更をコピー</button>
  <a href="index.html" class="back-link">← ホーム</a>
</div>

<div id="copy-banner">
  <p>以下をコピーして Claude に送ってください。タスクの追加・変更・完了を反映します。</p>
  <textarea id="copy-text" readonly></textarea>
  <div style="display:flex;gap:8px;margin-top:8px;">
    <button class="btn btn-orange" onclick="doCopy()">📋 クリップボードにコピー</button>
    <button class="btn btn-ghost" onclick="resetChanges()">変更をリセット</button>
    <button class="btn btn-ghost" onclick="document.getElementById('copy-banner').style.display='none'">閉じる</button>
  </div>
</div>

<div class="section-label label-cal">📅 カレンダー準備（7日以内）</div>
<div class="wrap">
  <table>
    <thead><tr>
      <th>イベント名</th><th>日付</th><th>時刻</th><th>準備内容</th>
    </tr></thead>
    <tbody id="cal-body"><tr><td colspan="4" style="color:var(--sub);padding:14px;text-align:center">読み込み中…</td></tr></tbody>
  </table>
</div>

<div class="section-label label-active">📋 アクティブ</div>
<div class="wrap">
  <table>
    <thead><tr>
      <th>タスク名</th><th>期日</th><th>カテゴリ</th><th>ステータス</th><th>備考</th><th></th>
    </tr></thead>
    <tbody id="active-body"></tbody>
  </table>
</div>

<div class="section-label label-done">✅ 完了済み</div>
<div class="wrap">
  <table>
    <thead><tr>
      <th>タスク名</th><th>期日</th><th>カテゴリ</th><th>備考</th>
    </tr></thead>
    <tbody id="done-body"></tbody>
  </table>
</div>

<script src="data.js"></script>
<script>
var _tasks = OTHER_TASKS.map(function(t){ return Object.assign({}, t); });
var _changes = {};

var CATEGORIES = ['連絡', '確認', '作業', '企画', 'その他'];
var STATUSES   = ['未着手', '対応中', '待ち', '完了'];

function statusClass(s) {
  if (s === '未着手') return 's-todo';
  if (s === '対応中') return 's-wip';
  if (s === '待ち')   return 's-wait';
  if (s === '完了')   return 's-done';
  return 's-todo';
}

function markChange(id, field, value) {
  if (!_changes[id]) _changes[id] = {};
  _changes[id][field] = value;
  var n = Object.keys(_changes).length;
  document.getElementById('change-count').textContent = n ? n + '件の変更あり' : '';
}

function editText(task, field, placeholder) {
  var inp = document.createElement('input');
  inp.type = 'text'; inp.className = 'edit-text';
  inp.placeholder = placeholder || '';
  inp.value = task[field] || '';
  if (_changes[task.id] && _changes[task.id][field] !== undefined) inp.classList.add('changed');
  inp.addEventListener('change', function() {
    task[field] = inp.value;
    markChange(task.id, field, inp.value);
    inp.classList.add('changed');
    render();
  });
  return inp;
}

function editDate(task, field) {
  var inp = document.createElement('input');
  inp.type = 'date'; inp.className = 'edit-date';
  if (task[field]) {
    var p = task[field].split('/');
    if (p.length === 2)
      inp.value = new Date().getFullYear() + '-' + p[0].padStart(2,'0') + '-' + p[1].padStart(2,'0');
    inp.classList.add('has-value');
  }
  if (_changes[task.id] && _changes[task.id][field] !== undefined) inp.classList.add('changed');
  inp.addEventListener('change', function() {
    if (!inp.value) { task[field] = ''; markChange(task.id, field, ''); inp.classList.remove('has-value'); render(); return; }
    var d = new Date(inp.value + 'T00:00:00');
    var label = (d.getMonth()+1) + '/' + d.getDate();
    task[field] = label;
    markChange(task.id, field, label);
    inp.classList.add('changed');
    inp.classList.add('has-value');
    render();
  });
  return inp;
}

function editSelect(task, field, options) {
  var sel = document.createElement('select');
  sel.className = 'edit-select';
  options.forEach(function(opt) {
    var o = document.createElement('option');
    o.value = opt; o.textContent = opt;
    if (task[field] === opt) o.selected = true;
    sel.appendChild(o);
  });
  if (_changes[task.id] && _changes[task.id][field] !== undefined) sel.classList.add('changed');
  sel.addEventListener('change', function() {
    task[field] = sel.value;
    markChange(task.id, field, sel.value);
    sel.classList.add('changed');
    render();
  });
  return sel;
}

function makeActiveRow(task) {
  var tr = document.createElement('tr');
  function tdi(el) { var d = document.createElement('td'); d.appendChild(el); return d; }

  tr.appendChild(tdi(editText(task, 'title', 'タスク名')));
  tr.appendChild(tdi(editDate(task, 'deadline')));
  tr.appendChild(tdi(editSelect(task, 'category', CATEGORIES)));
  tr.appendChild(tdi(editSelect(task, 'status', STATUSES)));
  tr.appendChild(tdi(editText(task, 'notes', '')));

  var btn = document.createElement('button');
  btn.className = 'done-btn'; btn.textContent = '✓';
  btn.title = '完了にする';
  btn.addEventListener('click', function() {
    task.status = '完了';
    markChange(task.id, 'status', '完了');
    render();
  });
  var td = document.createElement('td'); td.appendChild(btn); tr.appendChild(td);
  return tr;
}

function render() {
  var activeBody = document.getElementById('active-body');
  var doneBody   = document.getElementById('done-body');
  activeBody.innerHTML = '';
  doneBody.innerHTML = '';

  var active = _tasks.filter(function(t){ return t.status !== '完了'; });
  var done   = _tasks.filter(function(t){ return t.status === '完了'; });

  if (!active.length) {
    activeBody.innerHTML = '<tr><td colspan="6" class="empty">アクティブなタスクはありません 🎉<br><span style="color:var(--sub);font-size:.78rem">タスクを追加したいときは Claude に話しかけてください</span></td></tr>';
  } else {
    active.forEach(function(t) { activeBody.appendChild(makeActiveRow(t)); });
  }

  if (!done.length) {
    doneBody.innerHTML = '<tr><td colspan="4" class="empty" style="padding:12px">完了タスクはありません</td></tr>';
  } else {
    done.forEach(function(t) {
      var tr = document.createElement('tr');
      tr.classList.add('done-row');
      function td(v) {
        var el = document.createElement('td');
        el.textContent = v || '—';
        return el;
      }
      tr.appendChild(td(t.title));
      tr.appendChild(td(t.deadline));
      tr.appendChild(td(t.category));
      tr.appendChild(td(t.notes));
      doneBody.appendChild(tr);
    });
  }
}

function showCopy() {
  var ids = Object.keys(_changes);
  if (!ids.length) { alert('まだ変更はありません。'); return; }
  var L = { title:'タスク名', deadline:'期日', category:'カテゴリ', status:'ステータス', notes:'備考' };
  var lines = ['以下の変更を data.js の OTHER_TASKS に反映してコミットしてください。', ''];
  ids.forEach(function(id) {
    var t = _tasks.find(function(x){ return x.id === id; });
    lines.push('id: ' + id + '  (' + (t ? t.title : '') + ')');
    Object.keys(_changes[id]).forEach(function(f) {
      lines.push('  ' + (L[f]||f) + ': ' + (_changes[id][f] || '（空欄）'));
    });
    lines.push('');
  });
  document.getElementById('copy-text').value = lines.join('\n');
  document.getElementById('copy-banner').style.display = 'block';
  document.getElementById('copy-banner').scrollIntoView({behavior:'smooth'});
}
function doCopy() {
  navigator.clipboard.writeText(document.getElementById('copy-text').value).then(function() {
    var b = event.target; b.textContent = '✅ コピーしました';
    setTimeout(function(){ b.textContent = '📋 クリップボードにコピー'; }, 2000);
  });
}
function resetChanges() {
  _changes = {};
  document.getElementById('change-count').textContent = '';
  document.getElementById('copy-banner').style.display = 'none';
  render();
}

function fetchCalendar(cb) {
  var name = '_calCb' + Date.now();
  var sc = document.createElement('script');
  window[name] = function(data) {
    delete window[name];
    if (sc.parentNode) sc.parentNode.removeChild(sc);
    cb(null, data);
  };
  sc.onerror = function() {
    delete window[name];
    if (sc.parentNode) sc.parentNode.removeChild(sc);
    cb(new Error('load error'));
  };
  sc.src = WEB_APP_URL + '?type=calendar&callback=' + name;
  document.head.appendChild(sc);
}

function renderCalendar(events) {
  var tbody = document.getElementById('cal-body');
  tbody.innerHTML = '';
  if (!events || !events.length) {
    tbody.innerHTML = '<tr><td colspan="4" class="empty" style="padding:14px">準備が必要な予定はありません</td></tr>';
    return;
  }
  events.forEach(function(ev) {
    var tr = document.createElement('tr');
    var dayLabel = ev.daysUntil === 0 ? '今日' : ev.daysUntil === 1 ? '明日' : ev.daysUntil + '日後';

    var titleTd = document.createElement('td');
    if (ev.unknown) {
      var badge = document.createElement('span');
      badge.textContent = '❓';
      badge.title = '準備必要か未確認';
      badge.style.marginRight = '6px';
      titleTd.appendChild(badge);
    }
    titleTd.appendChild(document.createTextNode(ev.title));
    tr.appendChild(titleTd);

    var dateTd = document.createElement('td');
    dateTd.textContent = ev.eventDate + '（' + dayLabel + '）';
    if (ev.daysUntil <= 1) dateTd.style.color = 'var(--orange)';
    tr.appendChild(dateTd);

    function simpleTd(v, clr) {
      var td = document.createElement('td');
      td.textContent = v || '—';
      if (clr) td.style.color = clr;
      return td;
    }
    tr.appendChild(simpleTd(ev.startTime, 'var(--sub)'));

    var prepTd = document.createElement('td');
    if (ev.unknown) {
      prepTd.innerHTML = '<span style="color:var(--sub);font-size:.78rem">未確認 — Claude に確認依頼</span>';
    } else {
      prepTd.innerHTML = '<span style="color:#63b3ed;font-weight:600">' + ev.prepLabel + '</span>';
    }
    tr.appendChild(prepTd);

    tbody.appendChild(tr);
  });
}

render();
fetchCalendar(function(err, events) {
  if (err) {
    document.getElementById('cal-body').innerHTML =
      '<tr><td colspan="4" style="color:var(--sub);padding:14px;text-align:center">⚠ カレンダー取得失敗</td></tr>';
    return;
  }
  renderCalendar(events);
});
</script>
</body>
</html>
