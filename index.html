<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>編集D 添削タスク管理</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      padding: 20px 16px 40px;
      font-size: 13px;
    }
    .top-bar {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    h1 { font-size: 1.3rem; font-weight: 700; }
    #last-updated { font-size: 0.78rem; color: #999; }
    .refresh-btn {
      margin-left: auto;
      background: #0071e3;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .refresh-btn:hover { background: #0077ed; }

    /* ---- セクションラベル ---- */
    .section-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      margin: 18px 0 8px;
    }
    .label-urgent { background: #fff0f0; color: #c00; border: 1px solid #fcc; }
    .label-all    { background: #f0f4ff; color: #226; border: 1px solid #c8d8f8; }

    /* ---- テーブル共通 ---- */
    .wrap { width: 100%; overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      min-width: 900px;
    }
    th {
      background: #f0f0f5;
      padding: 8px 10px;
      text-align: left;
      font-size: 0.75rem;
      font-weight: 600;
      color: #555;
      white-space: nowrap;
    }
    td {
      padding: 8px 10px;
      border-top: 1px solid #f0f0f0;
      vertical-align: middle;
      white-space: nowrap;
    }
    tr:hover td { background: #fafafa; }

    /* ---- 編集可能セル ---- */
    td[contenteditable="true"] {
      background: #f0f7ff;
      cursor: text;
      min-width: 80px;
      border-radius: 4px;
      outline: none;
    }
    td[contenteditable="true"]:focus {
      background: #e0efff;
      box-shadow: 0 0 0 2px #0071e3 inset;
    }
    td[contenteditable="true"]:empty::before {
      content: attr(data-placeholder);
      color: #bbb;
      pointer-events: none;
    }

    /* ---- バッジ ---- */
    .done  { background: #e8f5e9; color: #166534; padding: 2px 8px; border-radius: 10px; font-size: 0.75rem; font-weight: 600; }
    .link-btn {
      display: inline-block;
      padding: 3px 10px;
      background: #f0f0f5;
      border-radius: 6px;
      text-decoration: none;
      color: #444;
      font-size: 0.75rem;
    }
    .link-btn:hover { background: #e0e0ea; }

    /* ---- ローディング ---- */
    #loading {
      text-align: center;
      padding: 30px;
      color: #888;
      display: none;
    }
    #error-msg {
      background: #fff0f0;
      border: 1px solid #fcc;
      border-radius: 8px;
      padding: 12px 16px;
      color: #c00;
      margin-top: 10px;
      display: none;
    }

    /* ---- 設定バナー ---- */
    #setup-banner {
      background: #fffbe6;
      border: 1px solid #ffe58f;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 16px;
      font-size: 0.82rem;
      line-height: 1.6;
    }
    #setup-banner strong { color: #b45309; }
  </style>
</head>
<body>

<div class="top-bar">
  <h1>編集D 添削タスク管理</h1>
  <span id="last-updated">未取得</span>
  <button class="refresh-btn" onclick="fetchData()">🔄 更新</button>
</div>


<div id="loading">📡 スプレッドシートからデータ取得中…</div>
<div id="error-msg"></div>

<!-- ⚡ 今すぐ対応が必要 -->
<div class="section-label label-urgent">⚡ 今すぐ対応が必要（引継ぎ済み・未完了）</div>
<div class="wrap">
  <table id="urgent-table">
    <thead>
      <tr>
        <th>公開予定日</th>
        <th>タイトル</th>
        <th>編集者</th>
        <th>初稿予定</th>
        <th>編集者状況</th>
        <th>添削期日</th>
        <th>修正期日</th>
        <th>備考</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="urgent-body">
      <tr><td colspan="9" style="color:#bbb;text-align:center;padding:16px">データ未取得</td></tr>
    </tbody>
  </table>
</div>

<!-- 📋 全体一覧 -->
<div class="section-label label-all">📋 全体一覧（伏見 担当 / 今日以降）</div>
<div class="wrap">
  <table id="main-table">
    <thead>
      <tr>
        <th>公開予定日</th>
        <th>タイトル</th>
        <th>撮影予定日</th>
        <th>引継日</th>
        <th>引継ぎ</th>
        <th>編集者</th>
        <th>初稿予定</th>
        <th>編集者状況</th>
        <th>添削期日</th>
        <th>修正期日</th>
        <th>備考</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="main-body">
      <tr><td colspan="12" style="color:#bbb;text-align:center;padding:16px">データ未取得</td></tr>
    </tbody>
  </table>
</div>

<script>
  // ▼▼▼ デプロイ後にここを書き換えてください ▼▼▼
  var WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxBj3IzsoqGLzBKD5JdRnJLVaGxZHba8vys5Pi3auTUNdOyQd1qFw40QIXGyXTsCaXd/exec';
  // ▲▲▲

  var STORAGE_KEY = 'editing_tasks_local';

  function getLocal() {
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  }
  function saveField(id, field, value) {
    var d = getLocal();
    if (!d[id]) d[id] = {};
    d[id][field] = value;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(d));
  }
  function getField(id, field) {
    var d = getLocal();
    return (d[id] && d[id][field]) ? d[id][field] : '';
  }

  function editableCell(id, field, placeholder) {
    var td = document.createElement('td');
    td.contentEditable = 'true';
    td.setAttribute('data-placeholder', placeholder || '');
    td.textContent = getField(id, field);
    td.addEventListener('blur', function() {
      saveField(id, field, td.textContent.trim());
      renderUrgent(window._lastRows);
    });
    return td;
  }

  function makeRow(r, isUrgent) {
    var tr = document.createElement('tr');
    function td(text, cls) {
      var el = document.createElement('td');
      if (cls) {
        var span = document.createElement('span');
        span.className = cls;
        span.textContent = text;
        el.appendChild(span);
      } else {
        el.textContent = text;
      }
      return el;
    }

    if (!isUrgent) {
      tr.appendChild(td(r.pubDate));
      tr.appendChild(td(r.title));
      tr.appendChild(td(r.shootDate));
      tr.appendChild(td(r.handoverDate));
      tr.appendChild(td(r.handoverDone, r.handoverDone ? 'done' : ''));
      tr.appendChild(td(r.editor));
      tr.appendChild(td(r.draftDate));
    } else {
      tr.appendChild(td(r.pubDate));
      tr.appendChild(td(r.title));
      tr.appendChild(td(r.editor));
      tr.appendChild(td(r.draftDate));
    }

    tr.appendChild(editableCell(r.id, 'editorStatus', '例：初稿待ち'));
    tr.appendChild(editableCell(r.id, 'proofDeadline', 'MM/DD'));
    tr.appendChild(editableCell(r.id, 'revisionDeadline', 'MM/DD'));
    tr.appendChild(editableCell(r.id, 'notes', ''));

    var linkTd = document.createElement('td');
    var a = document.createElement('a');
    a.href = r.sheetUrl;
    a.target = '_blank';
    a.className = 'link-btn';
    a.textContent = '📄 シート';
    linkTd.appendChild(a);
    tr.appendChild(linkTd);

    return tr;
  }

  function renderUrgent(rows) {
    if (!rows) return;
    var body = document.getElementById('urgent-body');
    body.innerHTML = '';
    var shown = 0;
    rows.forEach(function(r) {
      var status = getField(r.id, 'editorStatus');
      if (r.handoverDone === '済み' && status !== '完了') {
        body.appendChild(makeRow(r, true));
        shown++;
      }
    });
    if (shown === 0) {
      body.innerHTML = '<tr><td colspan="9" style="color:#bbb;text-align:center;padding:16px">対応が必要な案件はありません ✅</td></tr>';
    }
  }

  function renderMain(rows) {
    var body = document.getElementById('main-body');
    body.innerHTML = '';
    if (rows.length === 0) {
      body.innerHTML = '<tr><td colspan="12" style="color:#bbb;text-align:center;padding:16px">条件に合う案件がありません</td></tr>';
      return;
    }
    rows.forEach(function(r) {
      body.appendChild(makeRow(r, false));
    });
  }

  async function fetchData() {
    if (WEB_APP_URL === 'YOUR_WEB_APP_URL_HERE') {
      document.getElementById('error-msg').style.display = 'block';
      document.getElementById('error-msg').textContent = '⚠️ WEB_APP_URL が未設定です。上のセットアップ手順に従って設定してください。';
      return;
    }
    document.getElementById('loading').style.display = 'block';
    document.getElementById('error-msg').style.display = 'none';
    document.getElementById('last-updated').textContent = '取得中…';
    try {
      var res = await fetch(WEB_APP_URL);
      var rows = await res.json();
      window._lastRows = rows;
      renderMain(rows);
      renderUrgent(rows);
      document.getElementById('last-updated').textContent =
        '最終取得: ' + new Date().toLocaleTimeString('ja-JP');
    } catch(e) {
      document.getElementById('error-msg').style.display = 'block';
      document.getElementById('error-msg').textContent = '取得失敗: ' + e.message;
      document.getElementById('last-updated').textContent = '取得失敗';
    } finally {
      document.getElementById('loading').style.display = 'none';
    }
  }

  fetchData();
</script>
</body>
</html>
