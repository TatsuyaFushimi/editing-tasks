<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>編集D 添削タスク管理</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:       #111214;
      --surface:  #1a1c20;
      --surface2: #222428;
      --border:   #2e3035;
      --orange:   #ff6a1a;
      --text:     #e0e0e0;
      --sub:      #777;
      --muted:    #3a3a3a;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px 16px 60px;
      font-size: 13px;
    }
    .top-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
      flex-wrap: wrap;
    }
    .dot { width:10px;height:10px;background:var(--orange);border-radius:50%;box-shadow:0 0 8px var(--orange);flex-shrink:0; }
    h1 { font-size:1.15rem;font-weight:700;color:#fff;letter-spacing:.02em; }
    .spacer { flex:1; }
    .btn {
      border: none; border-radius: 8px; padding: 6px 14px;
      font-size: 0.78rem; font-weight: 600; cursor: pointer;
      letter-spacing: .03em; transition: opacity .15s;
    }
    .btn:hover { opacity: .8; }
    .btn-orange { background: var(--orange); color: #fff; }
    .btn-ghost  { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }

    /* コピーバナー */
    #copy-banner {
      display: none;
      background: var(--surface);
      border: 1px solid var(--orange);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 16px;
    }
    #copy-banner p { font-size:.78rem; color: var(--sub); margin-bottom: 8px; }
    #copy-text {
      width:100%; background: var(--bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 10px; font-size:.8rem; font-family: monospace;
      resize: vertical; min-height: 80px;
    }

    /* セクションラベル */
    .section-label {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 4px 14px; border-radius: 4px;
      font-size:.72rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
      margin: 22px 0 10px;
    }
    .label-urgent { background:rgba(255,106,26,.15); color:var(--orange); border-left:3px solid var(--orange); }
    .label-all    { background:rgba(255,255,255,.04); color:#aaa; border-left:3px solid #444; }

    /* テーブル */
    .wrap { width:100%; overflow-x:auto; }
    table {
      width:100%; border-collapse:collapse; background:var(--surface);
      border-radius:10px; overflow:hidden; min-width:960px;
      border:1px solid var(--border);
    }
    th {
      background:var(--surface2); padding:9px 12px; text-align:left;
      font-size:.7rem; font-weight:700; color:var(--sub);
      letter-spacing:.06em; text-transform:uppercase;
      white-space:nowrap; border-bottom:1px solid var(--border);
    }
    td {
      padding:8px 12px; border-top:1px solid var(--border);
      vertical-align:middle; white-space:nowrap; color:var(--text);
    }
    tr:hover td { background:rgba(255,255,255,.03); }

    /* 編集セル */
    .edit-text, .edit-date {
      background: rgba(255,106,26,.07);
      border: 1px solid transparent;
      border-radius: 4px;
      color: var(--text);
      font-size: 0.8rem;
      padding: 3px 7px;
      width: 100%;
      min-width: 80px;
      transition: background .15s, border-color .15s;
    }
    .edit-text:focus, .edit-date:focus {
      outline: none;
      background: rgba(255,106,26,.15);
      border-color: var(--orange);
    }
    .edit-text::placeholder, .edit-date:invalid { color: var(--muted); }
    .edit-date { min-width: 110px; cursor: pointer; }
    input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(.4); cursor: pointer; }

    /* バッジ */
    .done    { background:rgba(255,106,26,.2);color:var(--orange);padding:2px 9px;border-radius:20px;font-size:.72rem;font-weight:700; }
    .channel { background:var(--surface2);border:1px solid var(--border);padding:2px 8px;border-radius:4px;font-size:.7rem;color:#aaa; }
    .link-btn {
      display:inline-block; padding:3px 11px;
      background:var(--surface2); border:1px solid var(--border);
      border-radius:6px; text-decoration:none; color:#aaa;
      font-size:.72rem; transition:border-color .15s,color .15s;
    }
    .link-btn:hover { border-color:var(--orange); color:var(--orange); }

    /* 空状態 */
    .empty { color:#444; text-align:center; padding:20px; }

    /* 変更ハイライト */
    .changed { border-color: var(--orange) !important; }
  </style>
</head>

<div class="top-bar">
  <div class="dot"></div>
  <h1>編集D 添削タスク管理</h1>

  <textarea id="copy-text" readonly></textarea>
  <div style="display:flex;gap:8px;margin-top:8px;">

var _rows = [];
var _changes = {};

var _CH_PALETTE = [
  {bg:'rgba(255,106,26,.22)', color:'#ff8c4b', border:'rgba(255,106,26,.5)'},
  {bg:'rgba(99,179,237,.2)',  color:'#63b3ed', border:'rgba(99,179,237,.45)'},
  {bg:'rgba(104,211,145,.2)', color:'#68d391', border:'rgba(104,211,145,.45)'},
  {bg:'rgba(183,148,244,.2)', color:'#b794f4', border:'rgba(183,148,244,.45)'},
  {bg:'rgba(252,211,77,.18)', color:'#f6d860', border:'rgba(252,211,77,.45)'},
];
var _chColorMap = {};
function chColor(name) {
  if (!_chColorMap[name]) {
    var idx = Object.keys(_chColorMap).length % _CH_PALETTE.length;
    _chColorMap[name] = _CH_PALETTE[idx];
  }
  return _chColorMap[name];
}

function isUrgentRow(r) {
  if (r.editorStatus === '完了') return false;
  if (r.handoverDone === '済み') return true;
  if (r.proofDeadline) {
    var p = r.proofDeadline.split('/');
    if (p.length === 2) {
      var dl = new Date(new Date().getFullYear(), parseInt(p[0])-1, parseInt(p[1]));
      var today = new Date(); today.setHours(0,0,0,0);
      var diff = (dl - today) / 86400000;
      if (diff >= 0 && diff <= 3) return true;
    }
  }
  return false;
}

// JSONP でシートから取得
function fetchSheet(cb) {
  var name = '_cb' + Date.now();
  var sc = document.createElement('script');
  window[name] = function(data) {
    delete window[name];
    if (sc.parentNode) sc.parentNode.removeChild(sc);
    cb(null, data);
  };
  sc.onerror = function() {
    delete window[name];
    if (sc.parentNode) sc.parentNode.removeChild(sc);
    cb(new Error('load error'));
  };
  sc.src = WEB_APP_URL + '?callback=' + name;
  document.head.appendChild(sc);
}

function init() {
  // まず BAKED_DATA で即描画
  _rows = BAKED_DATA.map(function(r){ return Object.assign({}, r); });
  render();
  document.getElementById('status').textContent = '取得中…';

  fetchSheet(function(err, fresh) {
    if (err) {
      document.getElementById('status').textContent = '⚠ 取得失敗（保存データを表示中）';
      return;
    }
    _rows = fresh.map(function(r) {
      var saved = BAKED_DATA.find(function(b){ return b.id === r.id; }) || {};
      return Object.assign({}, r, {
        editorStatus:     saved.editorStatus     || '',
        proofDeadline:    saved.proofDeadline    || '',
        revisionDeadline: saved.revisionDeadline || '',
        notes:            saved.notes            || ''
      });
    });
    document.getElementById('status').textContent =
      '最終取得: ' + new Date().toLocaleTimeString('ja-JP');
    render();
  });
}

function markChange(id, field, value) {
  if (!_changes[id]) _changes[id] = {};
  _changes[id][field] = value;
  var n = Object.keys(_changes).length;
  document.getElementById('change-count').textContent = n ? n + '件の変更あり' : '';
}

function editText(row, field, placeholder) {
  var inp = document.createElement('input');
  inp.type = 'text'; inp.className = 'edit-text';
  inp.placeholder = placeholder || '';
  inp.value = row[field] || '';
  if (_changes[row.id] && _changes[row.id][field] !== undefined) inp.classList.add('changed');
  inp.addEventListener('change', function() {
    row[field] = inp.value;
    markChange(row.id, field, inp.value);
    inp.classList.add('changed');
    render();
  });
  return inp;
}

function editDate(row, field) {
  var inp = document.createElement('input');
  inp.type = 'date'; inp.className = 'edit-date';
  if (row[field]) {
    var p = row[field].split('/');
    if (p.length === 2)
      inp.value = new Date().getFullYear() + '-' + p[0].padStart(2,'0') + '-' + p[1].padStart(2,'0');
  }
  if (_changes[row.id] && _changes[row.id][field] !== undefined) inp.classList.add('changed');
  inp.addEventListener('change', function() {
    if (!inp.value) { row[field] = ''; markChange(row.id, field, ''); render(); return; }
    var d = new Date(inp.value + 'T00:00:00');
    var label = (d.getMonth()+1) + '/' + d.getDate();
    row[field] = label;
    markChange(row.id, field, label);
    inp.classList.add('changed');
    render();
  });
  return inp;
}

function makeRow(r, isUrgent) {
  var tr = document.createElement('tr');
  function td(v, cls) {
    var el = document.createElement('td');
    if (cls) {
      var s = document.createElement('span'); s.className = cls; s.textContent = v;
      if (cls === 'channel') {
        var c = chColor(v);
        s.style.background = c.bg; s.style.color = c.color; s.style.borderColor = c.border;
      }
      el.appendChild(s);
    } else el.textContent = v;
    return el;
  }
  function tdi(el) { var d = document.createElement('td'); d.appendChild(el); return d; }
  tr.appendChild(td(r.sheetName, 'channel'));
  tr.appendChild(td(r.pubDate));
  tr.appendChild(td(r.title));
  if (!isUrgent) {
    tr.appendChild(td(r.shootDate));
    tr.appendChild(td(r.handoverDate));
    tr.appendChild(td(r.handoverDone, r.handoverDone ? 'done' : ''));
  }
  tr.appendChild(td(r.editor));
  tr.appendChild(td(r.draftDate));
  tr.appendChild(tdi(editText(r, 'editorStatus', '例：初稿待ち')));
  tr.appendChild(tdi(editDate(r, 'proofDeadline')));
  tr.appendChild(tdi(editDate(r, 'revisionDeadline')));
  tr.appendChild(tdi(editText(r, 'notes', '')));
  var a = document.createElement('a');
  a.href = r.sheetUrl; a.target = '_blank'; a.className = 'link-btn'; a.textContent = '📄';
  var lt = document.createElement('td'); lt.appendChild(a); tr.appendChild(lt);
  return tr;
}

function render() {
  var ub = document.getElementById('urgent-body');
  var mb = document.getElementById('main-body');
  ub.innerHTML = ''; mb.innerHTML = '';
  var uc = 0;
  _rows.forEach(function(r) {
    mb.appendChild(makeRow(r, false));
    if (isUrgentRow(r)) {
      ub.appendChild(makeRow(r, true)); uc++;
    }
  });
  if (!uc) ub.innerHTML = '<tr><td colspan="10" class="empty">対応が必要な案件はありません ✅</td></tr>';
  if (!_rows.length) mb.innerHTML = '<tr><td colspan="13" class="empty">データがありません</td></tr>';
}

function showCopy() {
  var ids = Object.keys(_changes);
  if (!ids.length) { alert('まだ変更はありません。'); return; }
  var L = { editorStatus:'編集者状況', proofDeadline:'添削期日', revisionDeadline:'修正期日', notes:'備考' };
  var lines = ['以下の変更を BAKED_DATA に反映してコミットしてください。', ''];
  ids.forEach(function(id) {
    var r = _rows.find(function(x){ return x.id === id; });
    lines.push('id: ' + id + '  (' + (r ? r.sheetName + ' / ' + r.title : '') + ')');
    Object.keys(_changes[id]).forEach(function(f) {
      lines.push('  ' + (L[f]||f) + ': ' + (_changes[id][f] || '（空欄）'));
    });
    lines.push('');
  });
  document.getElementById('copy-text').value = lines.join('\n');
  document.getElementById('copy-banner').style.display = 'block';
  document.getElementById('copy-banner').scrollIntoView({behavior:'smooth'});
}
function doCopy() {
  navigator.clipboard.writeText(document.getElementById('copy-text').value).then(function() {
    var b = event.target; b.textContent = '✅ コピーしました';
    setTimeout(function(){ b.textContent = '📋 クリップボードにコピー'; }, 2000);
  });
}
function resetChanges() {
  _changes = {};
  document.getElementById('change-count').textContent = '';
  document.getElementById('copy-banner').style.display = 'none';
  render();
}

init();
</script>
</body>
</html>
