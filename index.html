<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>編集D 添削タスク管理</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #111214;
      --surface:   #1a1c20;
      --surface2:  #222428;
      --border:    #2e3035;
      --orange:    #ff6a1a;
      --orange-dim:#7a3210;
      --text:      #e0e0e0;
      --text-sub:  #777;
      --text-muted:#444;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px 16px 60px;
      font-size: 13px;
    }

    /* ---- トップバー ---- */
    .top-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }
    .logo-dot {
      width: 10px; height: 10px;
      background: var(--orange);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--orange);
      flex-shrink: 0;
    }
    h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #fff;
    }
    #last-updated { font-size: 0.75rem; color: var(--text-sub); }
    .refresh-btn {
      margin-left: auto;
      background: var(--orange);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 6px 16px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.03em;
      transition: opacity .15s;
    }
    .refresh-btn:hover { opacity: 0.85; }

    /* ---- セクションラベル ---- */
    .section-label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 4px 14px;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      margin: 22px 0 10px;
    }
    .label-urgent {
      background: rgba(255,106,26,.15);
      color: var(--orange);
      border-left: 3px solid var(--orange);
    }
    .label-all {
      background: rgba(255,255,255,.04);
      color: #aaa;
      border-left: 3px solid #444;
    }

    /* ---- テーブル ---- */
    .wrap { width: 100%; overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--surface);
      border-radius: 10px;
      overflow: hidden;
      min-width: 900px;
      border: 1px solid var(--border);
    }
    th {
      background: var(--surface2);
      padding: 9px 12px;
      text-align: left;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-sub);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 9px 12px;
      border-top: 1px solid var(--border);
      vertical-align: middle;
      white-space: nowrap;
      color: var(--text);
    }
    tr:hover td { background: rgba(255,255,255,.03); }

    /* ---- 編集可能セル ---- */
    td[contenteditable="true"] {
      background: rgba(255,106,26,.07);
      cursor: text;
      min-width: 80px;
      border-radius: 4px;
      outline: none;
      transition: background .15s;
    }
    td[contenteditable="true"]:focus {
      background: rgba(255,106,26,.15);
      box-shadow: 0 0 0 2px var(--orange) inset;
    }
    td[contenteditable="true"]:empty::before {
      content: attr(data-placeholder);
      color: var(--text-muted);
      pointer-events: none;
    }

    /* ---- バッジ ---- */
    .done {
      background: rgba(255,106,26,.2);
      color: var(--orange);
      padding: 2px 9px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .link-btn {
      display: inline-block;
      padding: 3px 11px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      text-decoration: none;
      color: #aaa;
      font-size: 0.72rem;
      transition: border-color .15s, color .15s;
    }
    .link-btn:hover { border-color: var(--orange); color: var(--orange); }

    /* ---- ローディング / エラー ---- */
    #loading {
      text-align: center;
      padding: 30px;
      color: var(--text-sub);
      display: none;
    }
    #error-msg {
      background: rgba(255,60,60,.1);
      border: 1px solid rgba(255,60,60,.3);
      border-radius: 8px;
      padding: 12px 16px;
      color: #ff6b6b;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>
<body>

<div class="top-bar">
  <div class="logo-dot"></div>
  <h1>編集D 添削タスク管理</h1>
  <span id="last-updated">未取得</span>
  <button class="refresh-btn" onclick="fetchData()">🔄 更新</button>
</div>


<div id="loading">📡 スプレッドシートからデータ取得中…</div>
<div id="error-msg"></div>

<!-- ⚡ 今すぐ対応が必要 -->
<div class="section-label label-urgent">⚡ 今すぐ対応が必要（引継ぎ済み・未完了）</div>
<div class="wrap">
  <table id="urgent-table">
    <thead>
      <tr>
        <th>公開予定日</th>
        <th>タイトル</th>
        <th>編集者</th>
        <th>初稿予定</th>
        <th>編集者状況</th>
        <th>添削期日</th>
        <th>修正期日</th>
        <th>備考</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="urgent-body">
      <tr><td colspan="9" style="color:#444;text-align:center;padding:20px">データ未取得</td></tr>
    </tbody>
  </table>
</div>

<!-- 📋 全体一覧 -->
<div class="section-label label-all">📋 全体一覧（伏見 担当 / 今日以降）</div>
<div class="wrap">
  <table id="main-table">
    <thead>
      <tr>
        <th>公開予定日</th>
        <th>タイトル</th>
        <th>撮影予定日</th>
        <th>引継日</th>
        <th>引継ぎ</th>
        <th>編集者</th>
        <th>初稿予定</th>
        <th>編集者状況</th>
        <th>添削期日</th>
        <th>修正期日</th>
        <th>備考</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="main-body">
      <tr><td colspan="12" style="color:#444;text-align:center;padding:20px">データ未取得</td></tr>
    </tbody>
  </table>
</div>

<script>
  // ▼▼▼ デプロイ後にここを書き換えてください ▼▼▼
  var WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxBj3IzsoqGLzBKD5JdRnJLVaGxZHba8vys5Pi3auTUNdOyQd1qFw40QIXGyXTsCaXd/exec';
  // ▲▲▲

  var STORAGE_KEY = 'editing_tasks_local';

  function getLocal() {
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  }
  function saveField(id, field, value) {
    var d = getLocal();
    if (!d[id]) d[id] = {};
    d[id][field] = value;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(d));
  }
  function getField(id, field) {
    var d = getLocal();
    return (d[id] && d[id][field]) ? d[id][field] : '';
  }

  function editableCell(id, field, placeholder) {
    var td = document.createElement('td');
    td.contentEditable = 'true';
    td.setAttribute('data-placeholder', placeholder || '');
    td.textContent = getField(id, field);
    td.addEventListener('blur', function() {
      saveField(id, field, td.textContent.trim());
      renderUrgent(window._lastRows);
    });
    return td;
  }

  function makeRow(r, isUrgent) {
    var tr = document.createElement('tr');
    function td(text, cls) {
      var el = document.createElement('td');
      if (cls) {
        var span = document.createElement('span');
        span.className = cls;
        span.textContent = text;
        el.appendChild(span);
      } else {
        el.textContent = text;
      }
      return el;
    }

    if (!isUrgent) {
      tr.appendChild(td(r.pubDate));
      tr.appendChild(td(r.title));
      tr.appendChild(td(r.shootDate));
      tr.appendChild(td(r.handoverDate));
      tr.appendChild(td(r.handoverDone, r.handoverDone ? 'done' : ''));
      tr.appendChild(td(r.editor));
      tr.appendChild(td(r.draftDate));
    } else {
      tr.appendChild(td(r.pubDate));
      tr.appendChild(td(r.title));
      tr.appendChild(td(r.editor));
      tr.appendChild(td(r.draftDate));
    }

    tr.appendChild(editableCell(r.id, 'editorStatus', '例：初稿待ち'));
    tr.appendChild(editableCell(r.id, 'proofDeadline', 'MM/DD'));
    tr.appendChild(editableCell(r.id, 'revisionDeadline', 'MM/DD'));
    tr.appendChild(editableCell(r.id, 'notes', ''));

    var linkTd = document.createElement('td');
    var a = document.createElement('a');
    a.href = r.sheetUrl;
    a.target = '_blank';
    a.className = 'link-btn';
    a.textContent = '📄 シート';
    linkTd.appendChild(a);
    tr.appendChild(linkTd);

    return tr;
  }

  function renderUrgent(rows) {
    if (!rows) return;
    var body = document.getElementById('urgent-body');
    body.innerHTML = '';
    var shown = 0;
    rows.forEach(function(r) {
      var status = getField(r.id, 'editorStatus');
      if (r.handoverDone === '済み' && status !== '完了') {
        body.appendChild(makeRow(r, true));
        shown++;
      }
    });
    if (shown === 0) {
      body.innerHTML = '<tr><td colspan="9" style="color:#444;text-align:center;padding:20px">対応が必要な案件はありません ✅</td></tr>';
    }
  }

  function renderMain(rows) {
    var body = document.getElementById('main-body');
    body.innerHTML = '';
    if (rows.length === 0) {
      body.innerHTML = '<tr><td colspan="12" style="color:#444;text-align:center;padding:20px">条件に合う案件がありません</td></tr>';
      return;
    }
    rows.forEach(function(r) {
      body.appendChild(makeRow(r, false));
    });
  }

  async function fetchData() {
    if (WEB_APP_URL === 'YOUR_WEB_APP_URL_HERE') {
      document.getElementById('error-msg').style.display = 'block';
      document.getElementById('error-msg').textContent = '⚠️ WEB_APP_URL が未設定です。上のセットアップ手順に従って設定してください。';
      return;
    }
    document.getElementById('loading').style.display = 'block';
    document.getElementById('error-msg').style.display = 'none';
    document.getElementById('last-updated').textContent = '取得中…';
    try {
      var res = await fetch(WEB_APP_URL);
      var rows = await res.json();
      window._lastRows = rows;
      renderMain(rows);
      renderUrgent(rows);
      document.getElementById('last-updated').textContent =
        '最終取得: ' + new Date().toLocaleTimeString('ja-JP');
    } catch(e) {
      document.getElementById('error-msg').style.display = 'block';
      document.getElementById('error-msg').textContent = '取得失敗: ' + e.message;
      document.getElementById('last-updated').textContent = '取得失敗';
    } finally {
      document.getElementById('loading').style.display = 'none';
    }
  }

  fetchData();
</script>
</body>
</html>
