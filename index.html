<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23111214'/><path d='M4 11L4 4L11 4' fill='none' stroke='%23ff6a1a' stroke-width='1' opacity='0.7'/><path d='M21 4L28 4L28 11' fill='none' stroke='%23ff6a1a' stroke-width='1' opacity='0.7'/><path d='M4 21L4 28L11 28' fill='none' stroke='%23ff6a1a' stroke-width='1' opacity='0.7'/><path d='M21 28L28 28L28 21' fill='none' stroke='%23ff6a1a' stroke-width='1' opacity='0.7'/><circle cx='9' cy='24' r='3.5' fill='none' stroke='%23ff6a1a' stroke-width='1.5'/><circle cx='23' cy='24' r='3.5' fill='none' stroke='%23ff6a1a' stroke-width='1.5'/><circle cx='16' cy='16' r='2.5' fill='%23ff6a1a' opacity='0.3'/><circle cx='16' cy='16' r='1.5' fill='%23ff6a1a'/><line x1='11.5' y1='21' x2='21' y2='8' stroke='%23ff6a1a' stroke-width='1.8' stroke-linecap='round'/><line x1='20.5' y1='21' x2='11' y2='8' stroke='%23ff6a1a' stroke-width='1.8' stroke-linecap='round'/></svg>">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タスク管理</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:       #111214;
      --surface:  #1a1c20;
      --surface2: #222428;
      --border:   #2e3035;
      --orange:   #ff6a1a;
      --text:     #e0e0e0;
      --sub:      #777;
      --muted:    #3a3a3a;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px 16px 60px;
      font-size: 13px;
    }
    .top-bar {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 24px; border-bottom: 1px solid var(--border);
      padding-bottom: 16px; flex-wrap: wrap;
    }
    .dot { width:10px;height:10px;background:var(--orange);border-radius:50%;box-shadow:0 0 8px var(--orange);flex-shrink:0; }
    h1 { font-size:1.15rem;font-weight:700;color:#fff;letter-spacing:.02em; }
    .spacer { flex:1; }
    .btn {
      border: none; border-radius: 8px; padding: 6px 14px;
      font-size: 0.78rem; font-weight: 600; cursor: pointer;
      letter-spacing: .03em; transition: opacity .15s; text-decoration: none;
      display: inline-flex; align-items: center; gap: 5px;
    }
    .btn:hover { opacity: .8; }
    .btn-orange { background: var(--orange); color: #fff; }
    .btn-ghost  { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }

    /* ナビカード */
    .nav-cards {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
      margin-bottom: 28px;
    }
    @media (max-width: 600px) { .nav-cards { grid-template-columns: 1fr; } }
    .nav-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 18px 20px;
      text-decoration: none; color: var(--text);
      display: flex; align-items: center; justify-content: space-between;
      transition: border-color .2s, background .2s;
    }
    .nav-card:hover { border-color: var(--orange); background: var(--surface2); }
    .nav-card-left { display: flex; flex-direction: column; gap: 4px; }
    .nav-card-label { font-size: .72rem; color: var(--sub); letter-spacing: .05em; text-transform: uppercase; }
    .nav-card-title { font-size: 1rem; font-weight: 700; color: #fff; }
    .nav-card-count {
      font-size: 1.8rem; font-weight: 700; color: var(--orange);
      line-height: 1;
    }
    .nav-card-arrow { font-size: 1.1rem; color: var(--sub); }

    /* セクションラベル */
    .section-label {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 4px 14px; border-radius: 4px;
      font-size:.72rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
      margin: 22px 0 10px;
    }
    .label-urgent { background:rgba(255,106,26,.15); color:var(--orange); border-left:3px solid var(--orange); }
    .label-video  { background:rgba(99,179,237,.1); color:#63b3ed; border-left:3px solid #63b3ed; }
    .label-other  { background:rgba(104,211,145,.1); color:#68d391; border-left:3px solid #68d391; }
    .label-cal    { background:rgba(99,179,237,.1); color:#63b3ed; border-left:3px solid #63b3ed; }

    /* テーブル */
    .wrap { width:100%; overflow-x:auto; }
    table {
      width:100%; border-collapse:collapse; background:var(--surface);
      border-radius:10px; overflow:hidden; min-width:600px;
      border:1px solid var(--border);
    }
    th {
      background:var(--surface2); padding:9px 12px; text-align:left;
      font-size:.7rem; font-weight:700; color:var(--sub);
      letter-spacing:.06em; text-transform:uppercase;
      white-space:nowrap; border-bottom:1px solid var(--border);
    }
    td {
      padding:8px 12px; border-top:1px solid var(--border);
      vertical-align:middle; white-space:nowrap; color:var(--text);
    }
    tr:hover td { background:rgba(255,255,255,.03); }

    /* バッジ */
    .channel { background:var(--surface2);border:1px solid var(--border);padding:2px 8px;border-radius:4px;font-size:.7rem;color:#aaa; }
    .status-badge {
      padding:2px 9px; border-radius:20px; font-size:.72rem; font-weight:700;
    }
    .link-btn {
      display:inline-block; padding:3px 11px;
      background:var(--surface2); border:1px solid var(--border);
      border-radius:6px; text-decoration:none; color:#aaa;
      font-size:.72rem; transition:border-color .15s,color .15s;
    }
    .link-btn:hover { border-color:var(--orange); color:var(--orange); }
    .page-link {
      display:inline-block; padding:3px 11px;
      background:rgba(255,106,26,.1); border:1px solid rgba(255,106,26,.3);
      border-radius:6px; text-decoration:none; color:var(--orange);
      font-size:.72rem; transition:border-color .15s;
    }
    .page-link:hover { border-color:var(--orange); }

    /* 空状態 */
    .empty { color:#444; text-align:center; padding:20px; }

    /* 済行グレーアウト */
    tr.row-done td { opacity: .3; }
    tr.row-done:hover td { opacity: .5; }

    /* ステータス色 */
    .s-todo    { background:rgba(255,255,255,.07); color:#aaa; }
    .s-wip     { background:rgba(99,179,237,.15);  color:#63b3ed; }
    .s-wait    { background:rgba(252,211,77,.12);  color:#f6d860; }
    .s-done    { background:rgba(104,211,145,.12); color:#68d391; }
    .s-urgent  { background:rgba(255,106,26,.2);   color:var(--orange); }

    .section-row {
      display:flex; align-items:center; justify-content:space-between;
      flex-wrap:wrap; gap:8px;
    }
  </style>
</head>
<body>

<div class="top-bar">
  <div class="dot"></div>
  <h1>タスク管理</h1>
  <span id="status" style="font-size:.75rem;color:var(--sub)">読み込み中…</span>
  <div class="spacer"></div>
  <a href="https://calendar.google.com/calendar/u/0/r/week" target="_blank" class="btn btn-ghost">📅 カレンダー</a>
  <a href="https://docs.google.com/spreadsheets/d/1VswrYvsGmY7hKLXwIjh9cptVHqhwthCiy5hatLvn-A4/edit?gid=706953571#gid=706953571" target="_blank" class="btn btn-ghost">📊 制作管理</a>

<div class="nav-cards">
  <a class="nav-card" href="video-tasks.html">
    <div class="nav-card-left">
      <span class="nav-card-label">VIDEO TASKS</span>
      <span class="nav-card-title">動画タスク</span>

  </a>
  <a class="nav-card" href="other-tasks.html#calendar">
    <div class="nav-card-left">
      <span class="nav-card-label">CALENDAR</span>

<div id="cal-section" style="display:none">
  <div class="section-label label-cal">📅 直近の準備が必要な予定</div>
  <div class="wrap">
    <table>
      <thead><tr>
        <th>イベント名</th><th>日付</th><th>時刻</th><th>準備内容</th>

<div class="wrap">
  <table>
    <thead><tr>
      <th>種別</th><th>タスク / タイトル</th><th>期日</th><th>状況</th><th>備考</th><th></th>
    </tr></thead>

<div class="section-row">
  <div class="section-label label-video" style="margin-bottom:10px">📹 動画タスク</div>
  <a href="video-tasks.html" class="page-link" style="margin-bottom:10px">詳細・編集 →</a>
</div>
<div class="wrap">
  <table>
    <thead><tr>
      <th>チャンネル</th><th>タイトル</th><th>公開日</th><th>編集者</th><th>編集者状況</th><th>添削期日</th><th></th>

</div>
<div class="wrap">
  <table>
    <thead><tr>
      <th>タスク名</th><th>期日</th><th>カテゴリ</th><th>ステータス</th><th>備考</th>
    </tr></thead>
    <tbody id="other-body"></tbody>
  </table>

<script src="data.js"></script>
<script>
var _videoRows = [];

var _CH_PALETTE = [
  {bg:'rgba(255,106,26,.22)', color:'#ff8c4b', border:'rgba(255,106,26,.5)'},
  {bg:'rgba(99,179,237,.2)',  color:'#63b3ed', border:'rgba(99,179,237,.45)'},
  {bg:'rgba(104,211,145,.2)', color:'#68d391', border:'rgba(104,211,145,.45)'},
  {bg:'rgba(183,148,244,.2)', color:'#b794f4', border:'rgba(183,148,244,.45)'},
  {bg:'rgba(252,211,77,.18)', color:'#f6d860', border:'rgba(252,211,77,.45)'},
];
var _chColorMap = {};
function chColor(name) {
  if (!_chColorMap[name]) {
    var idx = Object.keys(_chColorMap).length % _CH_PALETTE.length;
    _chColorMap[name] = _CH_PALETTE[idx];
  }
  return _chColorMap[name];
}

function sortVideoRows(rows) {
  return rows.slice().sort(function(a, b) {
    var ap = parseDateMs(a.proofDeadline);
    var bp = parseDateMs(b.proofDeadline);
    var ad = a.pubDateMs || parseDateMs(a.pubDate);
    var bd = b.pubDateMs || parseDateMs(b.pubDate);

    if (ap !== null && bp !== null) return ap - bp;
    if (ap !== null) return -1;
    if (bp !== null) return 1;
    if (ad === null && bd === null) return 0;
    if (ad === null) return 1;
    if (bd === null) return -1;
    return ad - bd;
  });
}

function isPastPubDate(pubDate) {
  if (!pubDate) return false;
  var p = pubDate.split('/');
  if (p.length !== 2) return false;
  var today = new Date(); today.setHours(0,0,0,0);
  var d = new Date(today.getFullYear(), parseInt(p[0])-1, parseInt(p[1]));
  return d < today;
}

function parseDateMs(str) {
  if (!str) return null;
  var p = str.split('/');
  if (p.length !== 2) return null;
  var d = new Date(new Date().getFullYear(), parseInt(p[0])-1, parseInt(p[1]));
  d.setHours(0,0,0,0);
  return d.getTime();
}

function isVideoUrgent(r) {
  if (r.editorStatus === '完了' || r.editorStatus === '済') return false;
  if (r.handoverDone === '済み') return true;
  var ms = parseDateMs(r.proofDeadline);
  if (ms !== null) {
    var today = new Date(); today.setHours(0,0,0,0);
    var diff = (ms - today.getTime()) / 86400000;
    if (diff >= 0 && diff <= 3) return true;
  }
  return false;
}

function isOtherUrgent(t) {
  if (t.status === '完了') return false;
  var ms = parseDateMs(t.deadline);
  if (ms === null) return false;
  var today = new Date(); today.setHours(0,0,0,0);
  var diff = (ms - today.getTime()) / 86400000;
  return diff >= 0 && diff <= 3;
}

function statusClass(s) {
  if (!s || s === '未着手') return 's-todo';
  if (s === '対応中') return 's-wip';
  if (s === '待ち') return 's-wait';
  if (s === '完了') return 's-done';
  return 's-todo';
}

function renderCalendarSection(events) {
  var known = (events || []).filter(function(e){ return !e.unknown; });
  if (!known.length) return;
  document.getElementById('cal-section').style.display = '';
  var tbody = document.getElementById('cal-body');
  tbody.innerHTML = '';
  known.forEach(function(ev) {
    var dayLabel = ev.daysUntil === 0 ? '今日' : ev.daysUntil === 1 ? '明日' : ev.daysUntil + '日後';
    var tr = document.createElement('tr');

    var t1 = document.createElement('td');
    t1.textContent = ev.title;
    tr.appendChild(t1);

    var t2 = document.createElement('td');
    t2.textContent = ev.eventDate + '（' + dayLabel + '）';
    if (ev.daysUntil <= 1) t2.style.color = 'var(--orange)';
    tr.appendChild(t2);

    var t3 = document.createElement('td');
    t3.textContent = ev.startTime || '—';
    t3.style.color = 'var(--sub)';
    tr.appendChild(t3);

    var t4 = document.createElement('td');
    t4.innerHTML = '<span style="color:#63b3ed;font-weight:600">' + ev.prepLabel + '</span>';
    tr.appendChild(t4);

    tbody.appendChild(tr);
  });
}

function fetchCalendar(cb) {
  var name = '_calCb' + Date.now();
  var sc = document.createElement('script');
  window[name] = function(data) {
    delete window[name];
    if (sc.parentNode) sc.parentNode.removeChild(sc);
    cb(null, data);
  };
  sc.onerror = function() {
    delete window[name];
    if (sc.parentNode) sc.parentNode.removeChild(sc);
    cb(new Error('load error'));
  };
  sc.src = WEB_APP_URL + '?type=calendar&callback=' + name;
  document.head.appendChild(sc);
}

function fetchSheet(cb) {
  var name = '_cb' + Date.now();
  var sc = document.createElement('script');
  window[name] = function(data) {
    delete window[name];
    if (sc.parentNode) sc.parentNode.removeChild(sc);
    cb(null, data);
  };
  sc.onerror = function() {
    delete window[name];
    if (sc.parentNode) sc.parentNode.removeChild(sc);
    cb(new Error('load error'));
  };
  sc.src = WEB_APP_URL + '?callback=' + name;
  document.head.appendChild(sc);
}

function init() {
  _videoRows = BAKED_DATA.map(function(r){ return Object.assign({}, r); })
    .filter(function(r){ return !isPastPubDate(r.pubDate); });
  render();
  document.getElementById('status').textContent = '取得中…';

  fetchSheet(function(err, fresh) {
    if (err) {
      document.getElementById('status').textContent = '⚠ 取得失敗（保存データ表示中）';
      return;
    }
    _videoRows = fresh.map(function(r) {
      var saved = BAKED_DATA.find(function(b){ return b.id === r.id; }) || {};
      return Object.assign({}, r, {
        editorStatus:     saved.editorStatus     || '',
        proofDeadline:    saved.proofDeadline    || '',
        revisionDeadline: saved.revisionDeadline || '',
        notes:            saved.notes            || ''
      });
    });
    document.getElementById('status').textContent =
      '最終取得: ' + new Date().toLocaleTimeString('ja-JP');
    render();
  });
}

function render() {
  var videoCount = _videoRows.length;
  var otherCount = OTHER_TASKS.filter(function(t){ return t.status !== '完了'; }).length;
  document.getElementById('video-count').textContent = videoCount;
  document.getElementById('other-count').textContent = otherCount;

  renderUrgent();
  renderVideo();
  renderOther();
}

function renderUrgent() {
  var tbody = document.getElementById('urgent-body');
  tbody.innerHTML = '';
  var items = [];

  _videoRows.forEach(function(r) {
    if (isVideoUrgent(r)) {
      items.push({
        type: '動画',
        title: r.title,
        deadline: r.proofDeadline || '—',
        status: r.editorStatus,
        notes: r.notes,
        link: r.sheetUrl,
        linkText: '📄',
        ch: r.sheetName
      });
    }
  });

  OTHER_TASKS.forEach(function(t) {
    if (isOtherUrgent(t)) {
      items.push({
        type: 'その他',
        title: t.title,
        deadline: t.deadline || '—',
        status: t.status,
        notes: t.notes,
        link: 'other-tasks.html',
        linkText: '→',
        ch: null
      });
    }
  });

  if (!items.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="empty">対応が必要な案件はありません ✅</td></tr>';
    return;
  }

  items.forEach(function(item) {
    var tr = document.createElement('tr');
    var typeBadge = '<span class="status-badge ' + (item.type === '動画' ? 's-wip' : 's-todo') + '">' + item.type + '</span>';
    tr.innerHTML = '<td>' + typeBadge + '</td>';

    var titleTd = document.createElement('td');
    titleTd.style.maxWidth = '260px';
    titleTd.style.overflow = 'hidden';
    titleTd.style.textOverflow = 'ellipsis';
    if (item.ch) {
      var c = chColor(item.ch);
      var badge = document.createElement('span');
      badge.className = 'channel';
      badge.textContent = item.ch;
      badge.style.background = c.bg;
      badge.style.color = c.color;
      badge.style.borderColor = c.border;
      badge.style.marginRight = '8px';
      titleTd.appendChild(badge);
    }
    titleTd.appendChild(document.createTextNode(item.title));
    tr.appendChild(titleTd);

    var dlTd = document.createElement('td');
    dlTd.textContent = item.deadline;
    dlTd.style.color = 'var(--orange)';
    dlTd.style.fontWeight = '700';
    tr.appendChild(dlTd);

    var stTd = document.createElement('td');
    stTd.innerHTML = '<span class="status-badge s-urgent">' + (item.status || '—') + '</span>';
    tr.appendChild(stTd);

    var ntTd = document.createElement('td');
    ntTd.textContent = item.notes || '';
    ntTd.style.color = 'var(--sub)';
    tr.appendChild(ntTd);

    var lkTd = document.createElement('td');
    var a = document.createElement('a');
    a.href = item.link; a.target = '_blank'; a.className = 'link-btn';
    a.textContent = item.linkText;
    lkTd.appendChild(a);
    tr.appendChild(lkTd);

    tbody.appendChild(tr);
  });
}

function renderVideo() {
  var tbody = document.getElementById('video-body');
  tbody.innerHTML = '';
  if (!_videoRows.length) {
    tbody.innerHTML = '<tr><td colspan="7" class="empty">データがありません</td></tr>';
    return;
  }
  sortVideoRows(_videoRows).forEach(function(r) {
    var tr = document.createElement('tr');
    if (r.editorStatus === '済') tr.classList.add('row-done');

    var chTd = document.createElement('td');
    var badge = document.createElement('span');
    badge.className = 'channel'; badge.textContent = r.sheetName;
    var c = chColor(r.sheetName);
    badge.style.background = c.bg; badge.style.color = c.color; badge.style.borderColor = c.border;
    chTd.appendChild(badge);
    tr.appendChild(chTd);

    var titleTd = document.createElement('td');
    titleTd.textContent = r.title;
    titleTd.style.maxWidth = '240px';
    titleTd.style.overflow = 'hidden';
    titleTd.style.textOverflow = 'ellipsis';
    tr.appendChild(titleTd);

    function simpleTd(v, clr) {
      var td = document.createElement('td');
      td.textContent = v || '—';
      if (clr) td.style.color = clr;
      return td;
    }

    tr.appendChild(simpleTd(r.pubDate));
    tr.appendChild(simpleTd(r.editor));

    var stTd = document.createElement('td');
    var sc = r.editorStatus === '済' || r.editorStatus === '完了' ? 's-done'
           : r.editorStatus ? 's-wip' : 's-todo';
    stTd.innerHTML = r.editorStatus
      ? '<span class="status-badge ' + sc + '">' + r.editorStatus + '</span>'
      : '<span style="color:var(--muted)">—</span>';
    tr.appendChild(stTd);

    var dlTd = document.createElement('td');
    dlTd.textContent = r.proofDeadline || '—';
    if (r.proofDeadline && isVideoUrgent(r)) dlTd.style.color = 'var(--orange)';
    tr.appendChild(dlTd);

    var lkTd = document.createElement('td');
    var a = document.createElement('a');
    a.href = r.sheetUrl; a.target = '_blank'; a.className = 'link-btn'; a.textContent = '📄';
    lkTd.appendChild(a);
    tr.appendChild(lkTd);

    tbody.appendChild(tr);
  });
}

function renderOther() {
  var tbody = document.getElementById('other-body');
  tbody.innerHTML = '';
  var active = OTHER_TASKS.filter(function(t){ return t.status !== '完了'; });
  if (!active.length) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty">タスクなし — <a href="other-tasks.html" style="color:var(--orange)">追加する →</a></td></tr>';
    return;
  }
  active.forEach(function(t) {
    var tr = document.createElement('tr');

    function td(v, extra) {
      var el = document.createElement('td');
      el.textContent = v || '—';
      if (extra) Object.assign(el.style, extra);
      return el;
    }

    tr.appendChild(td(t.title));

    var dlTd = td(t.deadline || '—');
    if (isOtherUrgent(t)) dlTd.style.color = 'var(--orange)';
    tr.appendChild(dlTd);

    tr.appendChild(td(t.category || '—', {color:'var(--sub)'}));

    var stTd = document.createElement('td');
    stTd.innerHTML = '<span class="status-badge ' + statusClass(t.status) + '">' + (t.status || '未着手') + '</span>';
    tr.appendChild(stTd);

    tr.appendChild(td(t.notes || '', {color:'var(--sub)'}));

    tbody.appendChild(tr);
  });
}

fetchCalendar(function(err, events) {
  if (err) { document.getElementById('cal-count').textContent = '!'; return; }
  var n = (events || []).filter(function(e){ return !e.unknown; }).length;
  document.getElementById('cal-count').textContent = n;
  if (n > 0) renderCalendarSection(events);
});

init();
</script>
</body>
</html>
